[package]
name = "keyboard-testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Keyboard TestKit Contributors"]
description = "Portable keyboard testing and diagnostic utility"
license = "MIT"

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# Serialization for config and logs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Cross-platform keyboard simulation (optional, requires system libs)
[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", optional = true }

[features]
default = []
virtual-send = ["enigo"]

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization for smaller binary
codegen-units = 1    # Single codegen unit for better optimization
panic = "abort"      # Abort on panic (smaller binary)
strip = true         # Strip symbols from binary

[profile.release.build-override]
opt-level = "z"
